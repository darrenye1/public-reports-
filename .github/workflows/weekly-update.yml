# Weekly auto-refresh: regenerate Top 20 PDFs, sync public/ + docs/, push to main.
# Vercel redeploys automatically after push (Output Directory = public).
name: Weekly research update

on:
  schedule:
    # Every Monday 14:00 UTC ? 9:00 AM US Eastern (standard time)
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      force_full:
        description: "Force full refresh of all tickers (slower)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: weekly-research-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate reports and sync website
        env:
          MPLBACKEND: Agg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_full }}" = "true" ]; then
            echo "Running full batch refresh..."
            python equity_research.py --batch-top20 --force --replace-old
          else
            echo "Running stale refresh (new period or >7 days)..."
            python equity_research.py --batch-top20 --refresh-stale --replace-old
          fi
          python sync_website.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ public/ docs/
          if git diff --staged --quiet; then
            echo "No file changes � skip commit."
          else
            git commit -m "chore: weekly research and website refresh"
            git push
          fi
